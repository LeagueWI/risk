name: Analyze Current Risk Scenes
on:
  push:
    paths:
      - '.github/workflows/analyze-current-scenes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy opencv-python-headless
      - name: Analyze all scene pairs
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import numpy as np, cv2, json, base64, io, os

          pairs = {
            "cityhall":("images/photoreal-v2/cityhall-safe.png","images/photoreal-v2/cityhall-risky.png"),
            "publicworks":("images/photoreal-v2/publicworks-safe.png","images/photoreal-v2/publicworks-risky.png"),
            "park":("images/photoreal-v2/park-safe.png","images/photoreal-v2/park-risky.png")
          }

          report={}
          for name,(sp,rp) in pairs.items():
            safe=Image.open(sp).convert("RGB"); risky=Image.open(rp).convert("RGB")
            A=np.array(safe); B=np.array(risky); h,w=A.shape[:2]

            ga=cv2.cvtColor(A,cv2.COLOR_RGB2GRAY).astype(np.float32)/255
            gb=cv2.cvtColor(B,cv2.COLOR_RGB2GRAY).astype(np.float32)/255
            warp=np.eye(2,3,dtype=np.float32)
            try:
              _,warp=cv2.findTransformECC(ga,gb,warp,cv2.MOTION_AFFINE,
                (cv2.TERM_CRITERIA_EPS|cv2.TERM_CRITERIA_COUNT,100,1e-6))
              Bal=cv2.warpAffine(B,warp,(w,h),flags=cv2.INTER_LINEAR+cv2.WARP_INVERSE_MAP,borderMode=cv2.BORDER_REFLECT)
            except Exception:
              Bal=B

            score=cv2.absdiff(A,Bal).mean(axis=2)
            # use both a strict and moderate mask to isolate meaningful changed objects
            strict=(score>44).astype(np.uint8)*255
            strict=cv2.morphologyEx(strict,cv2.MORPH_OPEN,np.ones((3,3),np.uint8))
            strict=cv2.morphologyEx(strict,cv2.MORPH_CLOSE,np.ones((11,11),np.uint8))
            n,labels,stats,cent=cv2.connectedComponentsWithStats(strict,8)
            comps=[]
            for i in range(1,n):
              x,y,cw,ch,area=stats[i]
              if area<180: continue
              cx,cy=cent[i]
              comps.append({
                "area":int(area),
                "cx":round(cx/w*100,1),"cy":round(cy/h*100,1),
                "x0":round(x/w*100,1),"y0":round(y/h*100,1),
                "x1":round((x+cw)/w*100,1),"y1":round((y+ch)/h*100,1)
              })
            comps=sorted(comps,key=lambda z:z["area"],reverse=True)[:25]

            # annotated full images with component boxes
            left=safe.resize((960,540),Image.Resampling.LANCZOS)
            right=risky.resize((960,540),Image.Resampling.LANCZOS)
            ann=Image.new("RGB",(1936,578),"white")
            ann.paste(left,(0,38)); ann.paste(right,(976,38))
            d=ImageDraw.Draw(ann)
            d.text((8,10),"SAFE",fill="black"); d.text((984,10),"RISKY + detected difference regions",fill="black")
            for idx,cc in enumerate(comps,1):
              x0=976+cc["x0"]/100*960; y0=38+cc["y0"]/100*540
              x1=976+cc["x1"]/100*960; y1=38+cc["y1"]/100*540
              d.rectangle((x0,y0,x1,y1),outline=(255,0,0),width=3)
              d.text((x0+3,y0+3),str(idx),fill=(255,255,255),stroke_width=2,stroke_fill=(0,0,0))
            bio=io.BytesIO(); ann.save(bio,"JPEG",quality=80,optimize=True)

            # heat map overlay for subtle differences
            heat=np.clip(score*3,0,255).astype(np.uint8)
            heat_color=cv2.applyColorMap(heat,cv2.COLORMAP_JET)
            overlay=cv2.addWeighted(Bal,0.58,heat_color,0.42,0)
            heat_img=Image.fromarray(cv2.cvtColor(overlay,cv2.COLOR_BGR2RGB)).resize((960,540),Image.Resampling.LANCZOS)
            hb=io.BytesIO(); heat_img.save(hb,"JPEG",quality=80,optimize=True)

            report[name]={
              "size":[w,h],
              "components":comps,
              "annotated":"data:image/jpeg;base64,"+base64.b64encode(bio.getvalue()).decode(),
              "heat":"data:image/jpeg;base64,"+base64.b64encode(hb.getvalue()).decode()
            }

          os.makedirs("analysis",exist_ok=True)
          with open("analysis/current-scenes.json","w") as f: json.dump(report,f)
          PY
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/current-scenes.json
          git commit -m "Analyze current scene differences" || exit 0
          git push
