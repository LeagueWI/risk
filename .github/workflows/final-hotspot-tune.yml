name: Final Hotspot Tune

on:
  push:
    paths:
      - scripts/tune_hotspots.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotspot tuning
        run: python scripts/tune_hotspots.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Final hotspot sensitivity tuning"
          git push
